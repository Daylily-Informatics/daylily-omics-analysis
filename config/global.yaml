---
pizzazz: "off"  # on or off
profile_name: "global"  # this is over-ridden when profile specific config is included

snv_callers_somatic:
  - "senttn"


parascopy:
  threads: 8
  mem_mb: 16000
  partition: "i8"
  locus_config: null  # Set to the path of the Parascopy locus configuration JSON.
  reference: null     # Optional override for the reference FASTA used by Parascopy.
  targets: null       # Optional BED/TSV of targets supplied to Parascopy.
  extra_args: ""


logs:
    operational:
        top: "logs/ops.log"
        lorm: "logs/lorm.log"
        about: "logs/about.log"
        docker: "logs/docker.log"
    day:
        top: "results/day/logs/day.log"


smaca:
  command: "SMAca.py"
  controls_manifest: ""
  panel_bed: ""
  extra_args: ""
  summary_filename: "SMAca_results.tsv"
  flags:
    case: "--case"
    crai: "--crai"
    reference: "--reference"
    controls: "--controls"
    panel: "--panel"
    output: "--output"
    sample: "--sample"
    threads: "--threads"


# example test data
remote_samples_table: ".test_data/data/0.01x_3_wgs_HG002_hg38.samples.tsv"
remote_units_table: ".test_data/data/0.01x_3_wgs_HG002_hg38.units.tsv"

# STILL WORKING?
sentieon_liscence_server: "localhost:8990"


# DEORECATED
# you would activate by adding ''' --config rule_action='{"ultraplex_iddnas":"run","kat":"run"}' ''' to the mod-run call
rule_action:
    ultraplex_iddnas: "run"
    kat: "skip"
    concordance: "run"
