---
pizzazz: "off"  # on or off
profile_name: "global"  # this is over-ridden when profile specific config is included

snv_callers_somatic:
  - "senttn"

hyb_ensemble:
  # ref_fa: /absolute/path/to/ref.fa  # Optional: override hg38 ref. Default: auto-resolved from supporting_files config.

  platforms:
    ILMN:
      callers:
        DV:  "path/to/ilmn_dv.vcf.gz"
        SENT: "path/to/ilmn_sent.vcf.gz"
    ONT:
      callers:
        DV:  "path/to/ont_dv.vcf.gz"
        SENT: "path/to/ont_sent.vcf.gz"

  mode: "A"
  pad_bp: 50

  thresholds:
    A:
      ont_qual_min_snv: 60
      ont_qual_min_indel: 80
      allow_ont_snv: false
    D:
      ont_qual_min_snv: 30
      ont_qual_min_indel: 50
      allow_ont_snv: true

parascopy:
  threads: 8
  mem_mb: 50000
  partition: "i8"
  locus_config: null  # Set to the path of the Parascopy locus configuration JSON.
  reference: null     # Optional override for the reference FASTA used by Parascopy.
  targets: null       # Optional BED/TSV of targets supplied to Parascopy.
  extra_args: ""

gauchian:
  threads: 1
  mem_mb: 50000
  partition: "i192"

cyrius:
  threads: 8
  mem_mb: 50000
  partition: "i192"

smn12:
  threads: 8
  mem_mb: 50000
  partition: "i192"

smncopynumbercaller_contract_validation:
  threads: 8
  mem_mb: 50000
  partition: "i192"

smn12_input_qc:
  threads: 4
  mem_mb: 50000
  partition: "i192"
  max_sample_records: 200000
  min_norm_bin_present_fraction: 0.95
  allow_failed_required_checks: false

logs:
    operational:
        top: "logs/ops.log"
        lorm: "logs/lorm.log"
        about: "logs/about.log"
        docker: "logs/docker.log"
    day:
        top: "results/day/logs/day.log"


smaca:
  command: "smaca"
  controls_manifest: ""
  panel_bed: ""
  extra_args: ""
  summary_filename: "SMAca_results.tsv"
  threads: 8
  mem_mb: 50000
  partition: "i192"
  flags:
    case: "--case"
    crai: "--crai"
    reference: "--reference"
    controls: "--controls"
    panel: "--panel"
    output: "--output"
    sample: "--sample"
    threads: "--threads"

sma_finder:
  command: "sma_finder"
  extra_args: ""
  threads: 1
  mem_mb: 50000
  partition: "i192"

hapsma:
  dev_exploratory: true
  ploidy: "4"
  start: "bam_single_remap"
  smn_region: "chr5:69949533-71054170"
  min_smn_region_mean_coverage: 4
  calling_target_bed:
    hg38: "/fsx/references/runtime_assets/tool_specific_resources/hapsma/hg38/SMN_region_38.smn_only.bed"
    hg38_broad: "/fsx/references/runtime_assets/tool_specific_resources/hapsma/hg38_broad/SMN_region_38.smn_only.bed"
  calling_target_region: "chr5:70049522-70954173"
  phaseset_region: "chr5:69949533-71054170"
  homopolymer_bed:
    hg38: "/fsx/references/runtime_assets/tool_specific_resources/hapsma/hg38/hg38_smn_100kb_pad_homopolymer_run3.bed"
    hg38_broad: "/fsx/references/runtime_assets/tool_specific_resources/hapsma/hg38_broad/hg38_broad_smn_100kb_pad_homopolymer_run3.bed"
  clair3model: "/fsx/references/runtime_assets/tool_specific_resources/clair3/models/r1041_e82_400bps_sup_v500"
  clair3_optional: "--haploid_sensitive --platform=ont --enable_long_indel"
  minimap_index:
    hg38: "/fsx/references/genomic_data/organism_references/H_sapiens/hg38/fasta_fai_minalt/GRCh38_no_alt_analysis_set.fasta"
    hg38_broad: "/fsx/references/genomic_data/organism_references/H_sapiens/hg38_broad/Homo_sapiens_assembly38.map-ont.mmi"
  minimap_param: "-y -ax map-ont"
  fastq_tags: "RG,Mm,Ml,MM,ML"
  min_read_length: 1000
  threads: 10
  mem_mb: 50000
  partition: "i192"

paraphase_ont_exploratory:
  dev_exploratory: true
  version: "3.5.0"
  threads: 10
  mem_mb: 50000
  partition: "i192"


# example test data
remote_samples_table: ".test_data/data/0.01x_3_wgs_HG002_hg38.samples.tsv"
remote_units_table: ".test_data/data/0.01x_3_wgs_HG002_hg38.units.tsv"

# STILL WORKING?
sentieon_liscence_server: "localhost:8990"


# DEPRECATED
rule_action:
    ultraplex_iddnas: "run"
    concordance: "run"
