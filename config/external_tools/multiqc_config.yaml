custom_data:
  giab_concordance:
    id: 'giab_concordance'
    section_name: 'Controls Concordance Report'
    description: 'Concordance Stats For The GIAB HC Regions For This Sample'
    file_format: 'tsv'
    plot_type: 'table'
    pconfig:
      id: 'giab_concordance'
  norm_cov_evenness_combo:
    id: 'norm_cov_evenness_combo'
    section_name: 'Coverage Eveness Metrics'
    description: 'Coverage Eveness Metrics'
    file_format: 'tsv'
    plot_type: 'table'
    section_href: 'https://en.wikipedia.org/wiki/Margaret_Oakley_Dayhoff'
    section_extra: '...'
    format: "{:.4f}"
    pconfig:
      id: 'norm_cov_evenness_combo'
  rules_benchmark_data:
    id: 'rules_benchmark_data'
    section_name: 'Task Benchmark Performances'
    description: 'Workflow Task Benchmark Results'
    file_format: 'tsv'
    plot_type: 'table'
    pconfig:
      id: 'rules_benchmark_data'
  alignstats_combo:
    id: 'alignstats_combo'
    section_name: 'Alignstats Data'
    description: 'Alignstats Data'
    file_format: 'tsv'
    plot_type: 'table'
    pconfig:
      id: 'alignstats_combo'
  expansionhunter:
    id: 'expansionhunter'
    section_name: 'ExpansionHunter STR Report'
    description: 'Disease-locus short tandem repeat calls from ExpansionHunter and STRchive annotations'
    file_format: 'tsv'
    plot_type: 'table'
    pconfig:
      id: 'expansionhunter'
  sequence_qc_outputs:
    id: 'sequence_qc_outputs'
    section_name: 'Sequence QC Output Inventory'
    description: 'Custom-data inventory for sequence QC outputs that may otherwise rely on native MultiQC discovery'
    file_format: 'tsv'
    plot_type: 'table'
    pconfig:
      id: 'sequence_qc_outputs'
  alignment_qc_outputs:
    id: 'alignment_qc_outputs'
    section_name: 'Alignment QC Output Inventory'
    description: 'Custom-data inventory for alignment QC outputs that may otherwise rely on native MultiQC discovery'
    file_format: 'tsv'
    plot_type: 'table'
    pconfig:
      id: 'alignment_qc_outputs'
  contamination:
    id: 'contamination'
    section_name: 'Contamination Estimates'
    description: 'VerifyBamID2, GATK, and genotype-free site-mix contamination estimates'
    file_format: 'tsv'
    plot_type: 'table'
    pconfig:
      id: 'contamination'
  gatk_contam:
    id: 'gatk_contam'
    section_name: 'GATK Contamination'
    description: 'GATK CalculateContamination output loaded as MultiQC custom content'
    file_format: 'tsv'
    plot_type: 'table'
    pconfig:
      id: 'gatk_contam'
  verifybamid2_panel_comparison:
    id: 'verifybamid2_panel_comparison'
    section_name: 'VerifyBamID2 SNP Panel Comparison'
    description: 'Panel-aware VerifyBamID2 contamination estimates and runtime fields'
    file_format: 'tsv'
    plot_type: 'table'
    pconfig:
      id: 'verifybamid2_panel_comparison'
  site_mix_contam:
    id: 'site_mix_contam'
    section_name: 'Genotype-Free Site-Mix Contamination'
    description: 'Target-genotype-free same-species contamination estimates'
    file_format: 'tsv'
    plot_type: 'table'
    pconfig:
      id: 'site_mix_contam'
  site_mix_donor:
    id: 'site_mix_donor'
    section_name: 'Site-Mix Donor Attribution'
    description: 'Optional source attribution from the genotype-free contamination estimator'
    file_format: 'tsv'
    plot_type: 'table'
    pconfig:
      id: 'site_mix_donor'
  bcftools_variant_stats:
    id: 'bcftools_variant_stats'
    section_name: 'bcftools Variant Stats'
    description: 'Small variant count summaries from bcftools stats'
    file_format: 'tsv'
    plot_type: 'table'
    pconfig:
      id: 'bcftools_variant_stats'
  peddy_sample_qc:
    id: 'peddy_sample_qc'
    section_name: 'Peddy Sample QC'
    description: 'Peddy sex, heterozygosity, and pedigree output summary'
    file_format: 'tsv'
    plot_type: 'table'
    pconfig:
      id: 'peddy_sample_qc'
  vep_annotation:
    id: 'vep_annotation'
    section_name: 'VEP Annotation Outputs'
    description: 'VEP annotation outputs when optional annotation QC is enabled'
    file_format: 'tsv'
    plot_type: 'table'
    pconfig:
      id: 'vep_annotation'
  snpeff_annotation:
    id: 'snpeff_annotation'
    section_name: 'SnpEff Annotation Outputs'
    description: 'SnpEff annotation outputs when optional annotation QC is enabled'
    file_format: 'tsv'
    plot_type: 'table'
    pconfig:
      id: 'snpeff_annotation'
  htd_calls:
    id: 'htd_calls'
    section_name: 'HTD Caller Outputs'
    description: 'Selected hard-to-detect-region caller outputs'
    file_format: 'tsv'
    plot_type: 'table'
    pconfig:
      id: 'htd_calls'
  alignstats_gs:
    id: 'alignstats_gs'
    section_name: 'alignstats_gs'
    description: 'Alignstats for Summary Table'
    file_format: 'tsv'
    plot_type: 'generalstats'
    pconfig:
      - sample:
          hidden: True
      - InsertSizeMean:
          hidden: True
      - InsertSizeMedian:
          hidden: True
      - InsertSizeMode:
          hidden: True
      - InsertSizeStandardDeviation:
          hidden: True
      - DuplicateReadsPct:
          hidden: True
      - ChimericReadPairPct:
          hidden: True

