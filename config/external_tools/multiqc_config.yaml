intro_text: ""

custom_logo: "resources/mqcimg/lsmc_git.jpeg"
custom_logo_url: "https://github.com/Daylily-Informatics/daylily"
custom_logo_title: "daylily ephemeral cluster"

max_table_rows: 2200
decimalPoint_format: "."
thousandsSep_format: ","

sample_names_replace_regex: true
sample_names_replace:
  "\\.md\\.(chr[0-9XYM]+)$": ".\\1"
  "\\.metrics$": ""
  "_FR$": ""
  "^(.*)-([A-Za-z0-9_]+)-(dmd|smd|spmd|na)-cram$": "\\1.\\2.\\3"

use_filename_as_sample_name:
  - fastqc
  - samtools
  - picard
  - qualimap
  - mosdepth
  - verifybamid
  - bcftools

extra_fn_clean_trim:
  - ".snv.sort.vcf.gz.tbi"
  - ".snv.sort.vcf.gz"
  - ".mosdepth.summary.txt"
  - ".mosdepth.global.dist.txt"
  - ".mosdepth.region.dist.txt"
  - ".idxstat.tsv"
  - ".bcfstats.tsv"
  - "_md"
  - ".vcf.gz"
  - ".bam"
  - ".bam.bai"
  - ".cram"
  - ".crai"
  - ".vcf.gz.tbi"
  - ".snv.sort"
  - ".idxstat"
  - ".bcfstats"
  - ".alignment_summary_metrics.txt"
  - ".insert_size_metrics.txt"
  - ".quality_yield_metrics.txt"
  - ".quality_distribution_metrics.txt"
  - ".gc_bias.summary_metrics.txt"
  - ".gc_bias.detail_metrics.txt"
  - ".rtg.vcfstats.txt"
  - ".verifybamid.selfSM"
  - ".peddy.sex_check.csv"
  - ".peddy.het_check.csv"
  - ".peddy.ped_check.csv"
  - ".legacy_compat.bam"
  - ".legacy_compat.bam.bai"


