intro_text: ""

custom_logo: "resources/mqcimg/lsmc_git.jpeg"
custom_logo_url: "https://github.com/Daylily-Informatics/daylily"
custom_logo_title: "daylily ephemeral cluster"

max_table_rows: 2200
decimalPoint_format: "."
thousandsSep_format: ","

sample_names_replace_regex: true
sample_names_replace:
  "\\.md\\.(chr[0-9XYM]+)$": ".\\1"

extra_fn_clean_trim:
  - ".snv.sort.vcf.gz.tbi"
  - ".snv.sort.vcf.gz"
  - ".mosdepth.summary.sort.bed"
  - ".idxstat.tsv"
  - ".bcfstats.tsv"
  - ".R1.fastq.gz"
  - ".R2.fastq.gz"
  - ".R1.fastq"
  - ".R2.fastq"
  - "_md"
  - ".vcf.gz"
  - ".bam"
  - ".bam.bai"
  - ".cram"
  - ".crai"
  - ".vcf.gz.tbi"
  - ".snv.sort"
  - ".idxstat"
  - ".mosdepth.summary.sort"
  - ".bcfstats"


module_order:
  # Raw data / sequence inputs
  - fastqc
  - fastq_screen
  - sequence_qc_outputs
  - kat
  # Mapping / alignment QC
  - samtools
  - bamtools
  - qualimap
  - sentieon
  - alignstats_combo
  - alignment_qc_outputs
  - mosdepth
  - goleft_indexcov
  # Deduplication / coverage QC
  - picard
  - norm_cov_evenness_combo
  # Sample identity / relatedness QC
  - peddy
  - peddy_sample_qc
  - somalier
  # SNV / small variant QC
  - bcftools
  - bcftools_variant_stats
  - vcftools
  # Contamination / sample mix
  - contamination
  - verifybamid2_panel_comparison
  - gatk_contam
  - giab_concordance
  - site_mix_contam
  - site_mix_donor
  # Annotation QC
  - vep
  - vep_annotation
  - snpeff_annotation
  # SV / repeat-expansion QC
  - expansionhunter
  - htd_calls
  # Other workflow metrics and uncategorized custom content
  - rules_benchmark_data
  - custom_content

custom_content:
  order:
    - sequence_qc_outputs
    - alignstats_combo
    - alignment_qc_outputs
    - normcovevenness_combo
    - peddy_sample_qc
    - bcftools_variant_stats
    - contamination
    - verifybamid2_panel_comparison
    - gatk_contam
    - giab_concordance
    - site_mix_contam
    - site_mix_donor
    - vep_annotation
    - expansionhunter
    - rules_benchmark_data

