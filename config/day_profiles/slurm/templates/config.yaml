---
# Adapted from
# # https://github.com/cbrueffer/snakemake-aws-parallelcluster-slurm 
cluster:
  mkdir -p "logs/slurm/{rule}/" &&
  sbatch
    --parsable
    --cpus-per-task={threads}
    --time={resources.time}
    --job-name="smk.{rule}{params.cluster_suffix}"
    --output="logs/slurm/{rule}/{rule}{params.cluster_suffix}.{jobid}.out"
    --error="logs/slurm/{rule}/{rule}{params.cluster_suffix}.{jobid}.err"
    --partition={resources.partition}
    --chdir="$PWD"
    --mem={resources.mem_mb}
    --comment="${DAY_PROJECT:-}"
    --distribution={resources.distribution}
    {resources.constraint}
    {resources.exclude}
    {resources.include}
    {resources.exclusive}
    {jobscript}

default-resources:
  - disk_mb=1000
  - mem_mb=3000
  - time=5440
  - partition=i192,i128,i192mem
  - distribution=block
  - exclusive=''
  - constraint=''
  - exclude=''
  - include=''

jobs: 300
cores: 4608  # SET TO AWS QUOTA LIMIT minus HEADNODE and other running ec2 spot instances
latency-wait: 100
local-cores: 8
restart-times: 1
max-jobs-per-second: 10
keep-going: True
keep-remote: True
rerun-incomplete: True
scheduler: greedy
use-conda: True
conda-frontend: conda
conda-prefix: "/fsx/resources/environments/conda/USER_REGSUB/HOSTNAME"
cluster-status: config/day_profiles/slurm/templates/status-scontrols.sh
cluster-cancel: scancel
max-status-checks-per-second: 20
force-use-threads: True
stats: "day_pipe_stats.json"
use-singularity: True
singularity-prefix: "/fsx/resources/environments/containers/USER_REGSUB/HOSTNAME"
singularity-args: "  -B /fsx:/fsx -B /tmp:/tmp -B $PWD/:$PWD   -B /dev/fd:/dev/fd  -B /dev/shm:$PWD/resources/dev/shm " 