---
latency-wait: 5
keep-remote: true
use-conda: true
conda-frontend: conda
conda-prefix: "/fsx/references/runtime_assets/cached_envs/conda"
force-use-threads: true
restart-times: 0  
cores: 8
scheduler: greedy
jobs: 1
restart-times: 0
max-jobs-per-second: 5
max-status-checks-per-second: 10
stats: "day_stats.json"
use-singularity: true
singularity-args: "  -B /fsx:/fsx -B /tmp:/tmp -B $PWD/:$PWD -B /dev/fd:/dev/fd  -B /dev/shm:$PWD/resources/dev/shm -B /dev/shm:/dev/shm "
singularity-prefix: "/fsx/references/runtime_assets/cached_envs/containers"

 
