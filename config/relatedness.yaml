# Example configuration for the standalone relatedness workflow.
#
# Run with:
#   snakemake -s workflow/rules/relatedness_test_day.smk \
#     --configfile config/relatedness.yaml produce_relatedness

ref_fasta: /fsx/references/genomic_data/organism_references/H_sapiens/hg38_broad/Homo_sapiens_assembly38.fasta
somalier_sites_vcf: /fsx/references/genomic_data/organism_annotations/H_sapiens/hg38/snp_vcfs/snp_subset_1M/filtered_vcfs/merged.500perchr.nosamp.sort.vcf.gz
genome_build: GRCh38

# TSV columns:
# sample_id, path, path_type, optional sex, batch_id, family_id
samples_manifest: config/relatedness_samples.tsv

# Optional TSV with columns:
# samples, relationship
# The samples field is "sample_a,sample_b".
expected_relationships: ""

relationship_thresholds:
  duplicate_min_relatedness: 0.95
  first_degree_min_relatedness: 0.40
  parent_child_max_ibs0: 2.0
  unrelated_max_relatedness: 0.20
