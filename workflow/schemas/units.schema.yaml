---
$schema: http://json-schema.org/draft-04/schema#

description: Daylily sequencing unit table (one row per run/lane/library).
properties:
    RUNID:
        type: string
    SAMPLEID:
        type: string
    EXPERIMENTID:
        type: string
    LANEID:
        type: string
    BARCODEID:
        type: string
    LIBPREP:
        type: string
    SEQ_PLATFORM:
        type: string
    SEQ_VENDOR:
        type: string
    ILMN_R1_PATH:
        type: string
    ILMN_R2_PATH:
        type: string
    PACBIO_R1_PATH:
        type: string
    PACBIO_R2_PATH:
        type: string
    ONT_R1_PATH:
        type: string
    ONT_R2_PATH:
        type: string
    UG_R1_PATH:
        type: string
    UG_R2_PATH:
        type: string
    SUBSAMPLE_PCT:
        type: string
    ILMN_TRIM_READ_LENGTH:
        type: string
    LONGREADTRIM_READ_LENGTH:
        type: string
    LONGREADTRIM_MODE:
        type: string
    ONT_BAM:
        type: string
    ONT_BAM_ALIGNER:
        type: string
    ONT_BAM_SNV_CALLER:
        type: string
    ROCHE_BAM:
        type: string
    ROCHE_BAM_ALIGNER:
        type: string
    SR_VCF_PATH:
        type: string
    LR_VCF_PATH:
        type: string
    ROCHE_BAM_SNV_CALLER:
        type: string
    ROCHE_DOWNSAMPLE_RATIO:
        type: string
    AMPLIFICATION_TYPE:
        type: string
    ALIGNED_REF_UID:
        type: string
    COMMENT:
        type: string
required:
    - RUNID
    - SAMPLEID
    - EXPERIMENTID
    - LANEID
    - BARCODEID
    - LIBPREP
    - SEQ_PLATFORM
