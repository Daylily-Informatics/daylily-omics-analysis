---
$schema: http://json-schema.org/draft-04/schema#

description: Analysis Samples Manifest Validator.  See README in config section for more info on each.
properties:
    sample:
        type: string
        description: >
            Combination of RU, EX, SQ and lane used internally by the
            workflow. If omitted, it will be generated automatically from
            other fields.
    sample_lane:
        type: string
        description: >
            Fully qualified sample identifier including lane. When not
            provided, it will be derived automatically from RU, EX, SQ and
            LANE.
    SQ:
        type: string
        description: Sample Type
    RU:
        type: string
        description: RUNID
    EX:
        type: string
        description: SAMPLE_ID
    LANE:
        type: integer
        description: Lane-SeqBarcodeID
    r1_path:
        type: string
    r2_path:
        type: string
    cram:
        type: string
    biological_sex:
        type: string
    iddna_uid:
        type: string
    concordance_control_path:
        type: string
    is_positive_control:
        type: boolean
    is_negative_control:
        type: boolean
    sample_type:
        type: string
    merge_single:
        type: string
    tum_nrm_sampleid_match:
        type: string
    external_sample_id:
        type: string
    ultima_cram:
        type: string
    ultima_cram_aligner:
        type: string
    ultima_cram_snv_caller:
        type: string
    ont_cram:
        type: string
    ont_cram_aligner:
        type: string
    ont_cram_snv_caller:
        type: string
required:
    - SQ
    - RU
    - EX
    - LANE
    - r1_path
    - r2_path
    - biological_sex
    - iddna_uid
    - concordance_control_path
    - is_positive_control
    - is_negative_control
    - sample_type
    - merge_single

