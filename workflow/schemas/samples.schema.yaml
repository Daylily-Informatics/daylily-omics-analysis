---
$schema: http://json-schema.org/draft-04/schema#

description: Daylily sample metadata table (one row per biological sample).
properties:
    RUNID:
        type: string
    SAMPLEID:
        type: string
    SAMPLESOURCE:
        type: string
    SAMPLECLASS:
        type: string
    BIOLOGICAL_SEX:
        type: string
    CONCORDANCE_CONTROL_PATH:
        type: string
    IS_POSITIVE_CONTROL:
        type: string
    IS_NEGATIVE_CONTROL:
        type: string
    SAMPLE_TYPE:
        type: string
    TUM_NRM_SAMPLEID_MATCH:
        type: string
    EXTERNAL_SAMPLE_ID:
        type: string
    N_X:
        type: string
    N_Y:
        type: string
    TRUTH_DATA_DIR:
        type: string
    COMMENT:
        type: string
required:
    - SAMPLEID
    - SAMPLESOURCE
    - SAMPLECLASS
    - BIOLOGICAL_SEX
    - CONCORDANCE_CONTROL_PATH
    - IS_POSITIVE_CONTROL
    - IS_NEGATIVE_CONTROL
    - SAMPLE_TYPE
    - EXTERNAL_SAMPLE_ID
