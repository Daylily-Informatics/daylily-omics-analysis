        type: string
    SAMPLEID:
        type: string
    SAMPLESOURCE:
        type: string
    SAMPLECLASS:
        type: string
    SAMPLEUSE:
        type: string
    BIOLOGICAL_SEX:
        type: string
    IDDNA_UID:
        type: string
    CONCORDANCE_CONTROL_PATH:
        type: string
    IS_POSITIVE_CONTROL:
        type: string
    IS_NEGATIVE_CONTROL:
